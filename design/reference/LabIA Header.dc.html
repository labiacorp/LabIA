<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/lucide-static@0.469.0/font/lucide.css">
<style>body{margin:0;background:#0A0B0E;color:#E9ECF2;font-family:Inter,sans-serif}a{color:#E9ECF2}a:hover{color:#fff}</style>
</helmet>
<div style="width:100%;height:56px;flex-shrink:0;background:#12141A;border-bottom:1px solid #262A35;box-sizing:border-box;font-family:Inter,sans-serif;color:#E9ECF2">
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <div style="height:100%;display:flex;align-items:center;gap:32px;padding:0 24px">
      <span style="font-family:'Space Grotesk';font-weight:700;font-size:20px;letter-spacing:-0.02em">Lab<span style="color:#3DDFA6">IA</span></span>
      <nav style="display:flex;gap:4px">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="3">
          <span style="height:32px;padding:0 12px;border-radius:8px;background:{{ n.bg }};color:{{ n.fg }};display:flex;align-items:center;font-size:14px;font-weight:500">{{ n.label }}</span>
        </sc-for>
      </nav>
      <div style="flex:1"></div>
      <sc-if value="{{ costOk }}" hint-placeholder-val="{{ true }}">
        <span style="height:28px;padding:0 10px;border-radius:999px;border:1px solid rgba(16,185,129,.28);background:rgba(16,185,129,.12);color:#3DDFA6;font:500 12px 'JetBrains Mono';display:inline-flex;align-items:center;gap:6px"><span style="color:#7D869A">mês</span>R$42,18</span>
      </sc-if>
      <sc-if value="{{ costOff }}" hint-placeholder-val="{{ false }}">
        <span style="height:28px;padding:0 10px;border-radius:999px;border:1px solid #262A35;background:#1A1D26;color:#7D869A;font:500 12px 'JetBrains Mono';display:inline-flex;align-items:center;gap:6px">mês<i class="icon-cloud-off" style="font-size:12px"></i>indisponível</span>
      </sc-if>
      <span style="height:36px;padding:0 12px;border-radius:8px;border:1px solid #343947;background:#1A1D26;font:500 14px Inter;display:flex;gap:6px;align-items:center"><i class="icon-plus" style="font-size:15px"></i>Criar</span>
      <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ true }}">
        <span style="width:32px;height:32px;border-radius:99px;background:#262A35;display:grid;place-items:center;font:600 12px 'Space Grotesk';box-shadow:0 0 0 2px #12141A,0 0 0 3px #343947">FZ</span>
      </sc-if>
      <sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ false }}">
        <span style="height:36px;padding:0 12px;border-radius:8px;color:#9AA3B5;font:500 14px Inter;display:flex;align-items:center">Entrar</span>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
    <div style="height:100%;display:flex;align-items:center;gap:4px;padding:0 6px 0 4px">
      <span style="width:44px;height:44px;display:grid;place-items:center;color:#E9ECF2"><i class="icon-menu" style="font-size:20px"></i></span>
      <span style="font-family:'Space Grotesk';font-weight:700;font-size:19px;letter-spacing:-0.02em">Lab<span style="color:#3DDFA6">IA</span></span>
      <div style="flex:1"></div>
      <sc-if value="{{ costOk }}" hint-placeholder-val="{{ true }}">
        <span style="height:26px;padding:0 8px;border-radius:999px;border:1px solid rgba(16,185,129,.28);background:rgba(16,185,129,.12);color:#3DDFA6;font:500 11px 'JetBrains Mono';display:inline-flex;align-items:center;gap:4px"><span style="color:#7D869A">mês</span>R$42,18</span>
      </sc-if>
      <sc-if value="{{ costOff }}" hint-placeholder-val="{{ false }}">
        <span style="height:26px;padding:0 8px;border-radius:999px;border:1px solid #262A35;background:#1A1D26;color:#7D869A;font:500 11px 'JetBrains Mono';display:inline-flex;align-items:center;gap:4px">mês<i class="icon-cloud-off" style="font-size:11px"></i></span>
      </sc-if>
      <span style="width:44px;height:44px;display:grid;place-items:center"><span style="width:32px;height:32px;border-radius:8px;border:1px solid #343947;background:#1A1D26;display:grid;place-items:center"><i class="icon-plus" style="font-size:16px"></i></span></span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:56},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;projetos&quot;,&quot;fluxos&quot;,&quot;biblioteca&quot;,&quot;none&quot;],&quot;default&quot;:&quot;projetos&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;cost&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;indisponivel&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;loggedOut&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'projetos';
    const mobile = !!this.props.mobile;
    const cost = this.props.cost ?? 'ok';
    const loggedOut = !!this.props.loggedOut;
    const nav = [['projetos', 'Projetos'], ['fluxos', 'Fluxos'], ['biblioteca', 'Biblioteca']].map(([k, label]) => ({
      label, bg: k === active ? '#1A1D26' : 'transparent', fg: k === active ? '#E9ECF2' : '#9AA3B5',
    }));
    return { nav, mobile, isDesktop: !mobile, costOk: cost === 'ok', costOff: cost !== 'ok', loggedIn: !loggedOut, loggedOut };
  }
}
</script>
</body>
</html>
