<!-- 10-contas A2. Em produção, colar este conteúdo em Authentication → Emails → Confirm signup. -->
<div style="font-family: Inter, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #12141a;">
  <p style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #10b981; margin: 0;">LabIA</p>
  <h1 style="font-size: 22px; margin: 8px 0 16px;">Confirme sua conta</h1>
  <p style="font-size: 15px; line-height: 1.6;">Clique no botão para confirmar o e-mail e entrar:</p>
  <p style="margin: 24px 0;">
    <a href="{{ .SiteURL }}/criar-conta/confirmar?token_hash={{ .TokenHash }}"
       style="background: #10b981; color: #0a0b0e; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: 600;">Confirmar e entrar</a>
  </p>
  <p style="font-size: 15px; line-height: 1.6;">Abriu este e-mail em outro aparelho? Digite o código na tela de cadastro:</p>
  <p style="font-family: 'JetBrains Mono', monospace; font-size: 28px; letter-spacing: 0.3em; margin: 8px 0 24px;">{{ .Token }}</p>
  <p style="font-size: 13px; color: #5d6577;">O link e o código valem 30 minutos. Se você não pediu esta conta, ignore este e-mail.</p>
</div>
